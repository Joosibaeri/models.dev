# Source: https://api.mammouth.ai/public/model/info (accessed 2026-10-26).
# Prices are USD per 1M tokens. Mammouth is a relay; model facts are inherited from the lab entry.
# Reasoning controls mirror the established openrouter entry for this base model.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75

# Source: https://api.mammouth.ai/public/model/info (accessed 2026-10-26).
# Prices are USD per 1M tokens. Mammouth is a relay; model facts are inherited from the lab entry.
# Reasoning controls mirror the established openrouter entry for this base model.
# Dynamic alias. On 2026-10-26 it routes to zhipuai/glm-5.3-flash with minimax/MiniMax-M3 as fallback.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "Mammouth Recommended"
description = "Dynamic Mammouth pick that routes to its current best price-performance model"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_576
output = 128_000

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5

# Source: https://api.mammouth.ai/public/model/info (accessed 2026-10-26).
# Prices are USD per 1M tokens. Mammouth is a relay; model facts are inherited from the lab entry.
# Reasoning controls mirror the established openrouter entry for this base model.
schema = 2
base_model = "google/gemini-3.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[limit]
output = 65_535

[cost.text.input]
price = 1.5
cache = { read = 0.15, write = 0.083 }

[cost.text.output]
price = 9

[cost.audio.input]
price = 3
cache = { read = 0.3 }

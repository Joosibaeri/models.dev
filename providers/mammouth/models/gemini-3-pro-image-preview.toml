# Source: https://api.mammouth.ai/public/model/info (accessed 2026-10-26).
# Prices are USD per 1M tokens. Mammouth is a relay; model facts are inherited from the lab entry.
# Reasoning controls mirror the established kilo entry for this base model.
schema = 2
base_model = "google/gemini-3-pro-image-preview"

[capabilities]
reasoning = { supported = true, effort = ["high"] }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 12

[cost.image.output]
price = 120
